# DevsFTP — Cross-Platform Build Configuration
appId: com.devsftp.app
productName: DevsFTP
copyright: Copyright © 2026 DevsFTP.com
npmRebuild: false

directories:
  output: dist

files:
  - "src/**/*"
  - "assets/**/*"
  - "package.json"

win:
  icon: assets/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevsFTP

linux:
  icon: assets/branding/icon_512.png
  category: Network
  synopsis: DevsFTP — High-Performance SFTP & FTP Client
  description: An FTP/SFTP client that works with you, not against you.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64

deb:
  packageCategory: net
  priority: optional
  maintainer: DevsFTP Support <support@devsftp.com>
  depends:
    - libfuse2t64 | libfuse2
    - libnotify4
    - libnss3
