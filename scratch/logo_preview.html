<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevsFTP Continuous Bezier D Logo Preview</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111315;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #E6E6E6;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px;
    }
    .title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #E6E6E6;
      margin: 0;
    }
    .subtitle {
      font-size: 14px;
      color: #68a063;
      font-weight: 600;
      margin-top: -16px;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <!-- DevsFTP Transparent Smooth Cubic Bezier D Vector SVG Logo -->
    <svg width="256" height="256" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Outer Capital D Loop - Single continuous cubic-bezier curve without notches -->
      <path d="M 130 110 L 250 110 C 390 110 390 402 250 402 L 130 402 Z" fill="none" stroke="#E6E6E6" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Inner Terminal Prompt '>': --text-muted (#7D838C) -->
      <path d="M 170 190 L 245 256 L 170 322" fill="none" stroke="#7D838C" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Connection Node Line & Circle '──●': --accent-primary (#68a063) -->
      <line x1="250" y1="256" x2="325" y2="256" stroke="#68a063" stroke-width="36" stroke-linecap="round"/>
      <circle cx="338" cy="256" r="26" fill="#68a063"/>
    </svg>

    <h1 class="title">DevsFTP</h1>
    <span class="subtitle">Remote Development Workspace</span>
  </div>

</body>
</html>
