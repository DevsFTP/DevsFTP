<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevSSH — Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0F172A; color: #F8FAFC; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { height: 42px; background: #1E293B; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .title { font-size: 13px; font-weight: 700; color: #38BDF8; display: flex; align-items: center; gap: 8px; }
    .terminal-container { flex: 1; padding: 16px; display: flex; align-items: center; justify-content: center; color: #94A3B8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">⚡ DevSSH Console</span>
  </div>
  <div class="terminal-container">
    <p>DevSSH Terminal Engine Initializing...</p>
  </div>
</body>
</html>
